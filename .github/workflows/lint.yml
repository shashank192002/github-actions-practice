# This linter will check if the syntax, format, indentation if its correct or not



name: Auto Linter

on:
  push: 
    branches:
    paths: "*.py"


jobs:
  code:
    runs-on: ubuntu-latest
    #this step will automatically clone the code of the current branch into the runner
    steps:
      - name: checkout/clone the code
        uses: actions/checkout@v7

      - name: Install Linter
        run: pip install ruff

      - name: Check linter against the python code
        run: ruff check .
